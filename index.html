<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        P.K. வேலம்பாளையம் கிழக்கு
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Noto Sans Tamil",
                sans-serif;

            background: #f5f6fa;

            color: #222;

        }


        /* ==================================================
           HEADER
        ================================================== */

        header {

            background: #6b21a8;

            color: white;

            padding: 18px;

            text-align: center;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        header h1 {

            margin: 0;

            font-size: 22px;

        }


        header p {

            margin: 6px 0 0;

            font-size: 13px;

        }


        /* ==================================================
           APP LAYOUT
        ================================================== */

        .app-layout {

            display: flex;

            min-height:
                calc(100vh - 94px);

        }


        /* ==================================================
           SIDEBAR
        ================================================== */

        .sidebar {

            width: 270px;

            min-width: 270px;

            background: white;

            border-right:
                1px solid #e5e7eb;

            padding: 18px 12px;

            box-shadow:
                2px 0 8px #0000000d;

            position: sticky;

            top: 94px;

            height:
                calc(100vh - 94px);

            overflow-y: auto;

        }


        .sidebar-title {

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                8px 10px 16px;

            border-bottom:
                1px solid #eeeeee;

            margin-bottom: 10px;

        }


        .sidebar-title-icon {

            font-size: 25px;

        }


        .sidebar-title h2 {

            margin: 0;

            font-size: 18px;

        }


        .sidebar-title p {

            margin:
                3px 0 0;

            color: #777;

            font-size: 11px;

        }


        .sidebar-menu {

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .side-menu {

            width: 100%;

            border: 0;

            background: transparent;

            border-radius: 11px;

            padding: 12px 10px;

            display: flex;

            align-items: center;

            gap: 11px;

            text-align: left;

            cursor: pointer;

            transition: 0.2s;

            color: #222;

        }


        .side-menu:hover {

            background: #faf5ff;

            transform:
                translateX(2px);

        }


        .side-menu.active {

            background: #f3e8ff;

            box-shadow:
                inset 3px 0 0 #6b21a8;

        }


        .side-icon {

            width: 38px;

            min-width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

            background: #f8f8f8;

            border-radius: 9px;

        }


        .side-menu-text {

            flex: 1;

            min-width: 0;

        }


        .side-menu b {

            display: block;

            font-size: 15px;

            line-height: 1.3;

        }


        .side-menu small {

            display: block;

            margin-top: 3px;

            color: #777;

            font-size: 10px;

            line-height: 1.3;

        }


        /* ==================================================
           MAIN CONTENT
        ================================================== */

        .main-content {

            flex: 1;

            min-width: 0;

            padding: 22px;

        }


        #home {

            max-width: 1100px;

            margin: auto;

        }


        .dashboard-title {

            margin:
                0 0 16px;

            font-size: 22px;

        }


        /* ==================================================
           DASHBOARD CARDS
        ================================================== */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 25px;

        }


        .card {

            background: white;

            padding: 17px;

            border-radius: 14px;

            box-shadow:
                0 2px 8px #0001;

        }


        .card small {

            color: #666;

            font-size: 13px;

        }


        .amount {

            margin-top: 7px;

            font-size: 23px;

            font-weight: bold;

        }


        .green {

            color: #16803c;

        }


        .red {

            color: #c62828;

        }


        .purple {

            color: #6b21a8;

        }


        .black {

            color: #111827;

        }


        .section-title {

            margin:
                0 0 15px;

            font-size: 21px;

        }


        /* ==================================================
           HOME INFO
        ================================================== */

        .home-info {

            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 2px 8px #0001;

        }


        .home-info h3 {

            margin:
                0 0 8px;

            font-size: 17px;

        }


        .home-info p {

            margin: 0;

            color: #666;

            font-size: 13px;

        }


        /* ==================================================
           PAGE
        ================================================== */

        .page {

            display: none;

            max-width: 1100px;

            margin: auto;

        }


        /* ==================================================
           BACK BUTTON
        ================================================== */

        .back {

            border: 0;

            padding:
                10px 15px;

            border-radius: 9px;

            cursor: pointer;

            margin-bottom: 14px;

            background: white;

            box-shadow:
                0 2px 6px #0001;

            font-size: 14px;

        }


        .back:hover {

            background: #faf5ff;

        }


        /* ==================================================
           MODULE HEADER
        ================================================== */

        .module-header {

            background: white;

            padding: 17px;

            border-radius: 14px;

            box-shadow:
                0 2px 8px #0001;

            margin-bottom: 15px;

        }


        .module-header h2 {

            margin: 0;

            font-size: 21px;

        }


        .module-header p {

            margin:
                5px 0 0;

            color: #777;

            font-size: 13px;

        }


        /* ==================================================
           MENU GRID
        ================================================== */

        .menu-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

        }


        .menu {

            border: 0;

            background: white;

            padding: 18px;

            border-radius: 14px;

            text-align: left;

            box-shadow:
                0 2px 8px #0001;

            cursor: pointer;

            transition: 0.2s;

        }


        .menu:hover {

            background: #faf5ff;

            transform:
                translateY(-2px);

        }


        .menu b {

            display: block;

            font-size: 16px;

            margin-bottom: 6px;

        }


        .menu span {

            color: #666;

            font-size: 12px;

        }


        /* ==================================================
           FORM
        ================================================== */

        .form {

            background: white;

            padding: 18px;

            border-radius: 14px;

            box-shadow:
                0 2px 8px #0001;

        }


        .form-title {

            margin:
                0 0 15px;

            font-size: 19px;

        }


        label {

            display: block;

            margin-top: 11px;

            font-weight: bold;

            font-size: 14px;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 11px;

            margin-top: 5px;

            border:
                1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            font-family:
                Arial,
                "Noto Sans Tamil",
                sans-serif;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                #6b21a8;

            box-shadow:
                0 0 0 2px #6b21a822;

        }


        textarea {

            min-height: 140px;

            resize: vertical;

        }


        .save {

            margin-top: 15px;

            background: #6b21a8;

            color: white;

            border: 0;

            padding:
                12px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;

        }


        .save:hover {

            background: #581c87;

        }


        .cancel {

            margin-top: 15px;

            margin-left: 8px;

            background: #eeeeee;

            color: #333;

            border: 0;

            padding:
                12px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;

        }


        .cancel:hover {

            background: #ddd;

        }


        /* ==================================================
           DECISION LIST
        ================================================== */

        .decision-list {

            margin-top: 22px;

        }


        .decision-list-header {

            background: white;

            padding: 16px;

            border-radius: 14px;

            box-shadow:
                0 2px 8px #0001;

            margin-bottom: 12px;

        }


        .decision-list-header h3 {

            margin:
                0 0 12px;

            font-size: 18px;

        }


        .decision-search {

            width: 100%;

        }


        .decision-card {

            background: white;

            padding: 16px;

            margin-bottom: 10px;

            border-radius: 13px;

            box-shadow:
                0 2px 7px #0001;

        }


        .decision-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

        }


        .decision-number {

            font-weight: bold;

            color: #6b21a8;

            font-size: 16px;

        }


        .decision-date {

            color: #777;

            font-size: 12px;

        }


        .decision-description {

            margin-top: 10px;

            line-height: 1.6;

            white-space: pre-wrap;

            font-size: 14px;

        }


        .status {

            display: inline-block;

            margin-top: 10px;

            padding:
                5px 10px;

            border-radius: 20px;

            font-size: 11px;

            background: #f3e8ff;

            color: #6b21a8;

        }


        .decision-actions {

            display: flex;

            gap: 7px;

            margin-top: 13px;

        }


        .edit-btn {

            border: 0;

            background: #e0f2fe;

            color: #0369a1;

            padding:
                8px 12px;

            border-radius: 7px;

            cursor: pointer;

        }


        .delete-btn {

            border: 0;

            background: #fee2e2;

            color: #dc2626;

            padding:
                8px 12px;

            border-radius: 7px;

            cursor: pointer;

        }


        .edit-btn:hover {

            background: #bae6fd;

        }


        .delete-btn:hover {

            background: #fecaca;

        }


        .empty {

            background: white;

            padding: 25px;

            text-align: center;

            color: #777;

            border-radius: 12px;

        }


        .loading {

            padding: 15px;

            text-align: center;

            color: #666;

        }


        /* ==================================================
           MESSAGE
        ================================================== */

        .message {

            margin-top: 12px;

            padding: 10px;

            border-radius: 8px;

            font-size: 13px;

            display: none;

        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;

        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 800px) {

            .app-layout {

                flex-direction: column;

            }


            .sidebar {

                width: 100%;

                min-width: 100%;

                height: auto;

                position: static;

                border-right: 0;

                border-bottom:
                    1px solid #e5e7eb;

                padding: 10px;

            }


            .sidebar-title {

                padding:
                    6px 8px 10px;

            }


            .sidebar-menu {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 6px;

            }


            .side-menu {

                padding: 9px;

            }


            .side-menu b {

                font-size: 13px;

            }


            .side-menu small {

                font-size: 9px;

            }


            .main-content {

                padding: 15px;

            }

        }


        /* ==================================================
           SMALL MOBILE
        ================================================== */

        @media (max-width: 500px) {

            header {

                padding:
                    15px 10px;

            }


            header h1 {

                font-size: 18px;

            }


            header p {

                font-size: 11px;

            }


            .sidebar-menu {

                grid-template-columns:
                    1fr;

            }


            .cards {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 8px;

            }


            .card {

                padding: 13px;

            }


            .amount {

                font-size: 18px;

            }


            .menu-grid {

                grid-template-columns:
                    1fr;

            }


            .dashboard-title {

                font-size: 20px;

            }


            .section-title {

                font-size: 19px;

            }


            .decision-top {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .decision-actions {

                flex-wrap: wrap;

            }

        }

    </style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <h1>
        🛕 P.K. வேலம்பாளையம் கிழக்கு
    </h1>

    <p>
        வரவு • செலவு • கையிருப்பு கணக்கு
    </p>

</header>



<!-- ==================================================
     APP LAYOUT
================================================== -->

<div class="app-layout">


    <!-- ==================================================
         LEFT SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <div class="sidebar-title">

            <div class="sidebar-title-icon">
                📋
            </div>

            <div>

                <h2>
                    முக்கிய பிரிவுகள்
                </h2>

                <p>
                    Main Sections
                </p>

            </div>

        </div>



        <div class="sidebar-menu">


            <!-- MEMBER -->

            <button
                id="sideMember"
                class="side-menu"
                onclick="
                    window.location.href =
                    'pages/member.html?view=list'
                "
            >

                <div class="side-icon">
                    👥
                </div>

                <div class="side-menu-text">

                    <b>

                    </b>

                    <small>
                        உறுப்பினர் பட்டியல்
                    </small>

                </div>

            </button>



            <!-- PODAVI -->

            <button
                id="sidePodavi"
                class="side-menu"
                onclick="
                    openModule('podavi')
                "
            >

                <div class="side-icon">

                </div>

                <div class="side-menu-text">

                    <b>
                        Podavi
                    </b>

                    <small>
                        Income • Expense • Split
                    </small>

                </div>

            </button>



            <!-- FUND -->

            <button
                id="sideFund"
                class="side-menu"
                onclick="
                    openModule('fund')
                "
            >

                <div class="side-icon">
                    💰
                </div>

                <div class="side-menu-text">

                    <b>
                        Fund
                    </b>

                    <small>
                        Collection • Split • Report
                    </small>

                </div>

            </button>



            <!-- PKV KOVIL -->

            <button
                id="sideKovil"
                class="side-menu"
                onclick="
                    openModule('kovil')
                "
            >

                <div class="side-icon">
                    🛕
                </div>

                <div class="side-menu-text">

                    <b>
                        PKV Kovil
                    </b>

                    <small>
                        Income • Expense • Report
                    </small>

                </div>

            </button>



            <!-- AMAVASAI -->

            <button
                id="sideAmavasai"
                class="side-menu"
                onclick="
                    openModule('amavasai')
                "
            >

                <div class="side-icon">
                    🌙
                </div>

                <div class="side-menu-text">

                    <b>
                        அமாவாசை பூஜை
                    </b>

                    <small>
                        Income • Expense • Report
                    </small>

                </div>

            </button>



            <!-- TOUR -->

            <button
                id="sideTour"
                class="side-menu"
                onclick="
                    window.location.href='pages/tour.html'
                "
            >

                <div class="side-icon">
                    🚌
                </div>

                <div class="side-menu-text">

                    <b>
                        Tour
                    </b>

                    <small>
                        சுற்றுலா
                    </small>

                </div>

            </button>



            <!-- DECISION -->

            <button
                id="sideDecision"
                class="side-menu"
                onclick="
                    openModule('decision')
                "
            >

                <div class="side-icon">
                    📜
                </div>

                <div class="side-menu-text">

                    <b>
                        தீர்மானம்

                    <small>
                        தீர்மான பதிவு

            </button>


        </div>

    </aside>



    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


        <!-- ==================================================
             HOME
        ================================================== -->

        <div id="home">


            <h2 class="dashboard-title">
                Dashboard
            </h2>



            <div class="cards">


                <div class="card">

                    <small>
                        மொத்த வரவு
                    </small>

                    <div
                        id="totalIncome"
                        class="amount green"
                    >
                        ₹0
                    </div>

                </div>



                <div class="card">

                    <small>
                        மொத்த செலவு
                    </small>

                    <div
                        id="totalExpense"

                    >

                    </div>

                </div>

                    <small>
                        கையிருப்பு

                    >

                    </div>

                <div class="card">

                    </div>

        <!-- ==================================================

        ================================================== -->

        <div
            id="page"
            class="page"
        ></div>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script type="module">


import {

    db,

    collection,

    addDoc,

    getDocs,

    updateDoc,

    deleteDoc,

    doc,

    serverTimestamp

}
from "./firebase.js";



/* =====================================================
   ELEMENTS
===================================================== */

const home =
    document.getElementById(
        "home"
    );


const page =
    document.getElementById(
        "page"
    );



/* =====================================================
   DASHBOARD
===================================================== */

let totalIncome = 0;

let totalExpense = 0;

let totalSplit = 0;



/* =====================================================
   SIDEBAR
===================================================== */

const sidebarButtons = {

    podavi:
        document.getElementById(
            "sidePodavi"
        ),

    fund:
        document.getElementById(
            "sideFund"
        ),

    kovil:
        document.getElementById(
            "sideKovil"
        ),

    amavasai:
        document.getElementById(
            "sideAmavasai"
        ),

    tour:
        document.getElementById(
            "sideTour"
        ),

    decision:
        document.getElementById(
            "sideDecision"
        )

};



/* =====================================================
   MODULES
===================================================== */

const modules = {


    podavi: {

        title:
            "📒 Podavi",

        subtitle:
            "போடவி கணக்கு",

        menus: [

            "Income & Expense",

            "Balance Amount Split to Member",

            "Split Amount Collected from Member",

            "Report"

        ]

    },


    fund: {

        title:
            "💰 Fund",

        subtitle:
            "நிதி கணக்கு",

        menus: [

            "Collection",

            "Split Amount to Member",

            "Split Amount Collected from Member",

            "Report"

        ]

    },


    kovil: {

        title:
            "🛕 PKV Kovil",

        subtitle:
            "கோவில் கணக்கு",

        menus: [

            "Income & Expense",

            "Report"

        ]

    },


    amavasai: {

        title:
            "🌙 அமாவாசை பூஜை",

        subtitle:
            "அமாவாசை பூஜை கணக்கு",

        menus: [

            "Income & Expense",

            "Report"

        ]

    },


    tour: {

        title:
            "🚌 Tour",

        subtitle:
            "சுற்றுலா கணக்கு",

        menus: [

            "Income & Expense"

        ]

    },


    decision: {

        title:
            "📜 தீர்மானம்",

        subtitle:
            "தீர்மான பதிவு",

        menus: [

            "தீர்மான பதிவு"

        ]

    }

};



/* =====================================================
   SIDEBAR ACTIVE
===================================================== */

function clearSidebarActive() {

    document
        .querySelectorAll(
            ".side-menu"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );

}


function setSidebarActive(
    moduleName
) {

    clearSidebarActive();

    const button =
        sidebarButtons[
            moduleName
        ];

    if (button) {

        button.classList.add(
            "active"
        );

    }

}



/* =====================================================
   HOME
===================================================== */

function showHomePage() {

    page.style.display =
        "none";

    page.innerHTML =
        "";

    home.style.display =
        "block";

    clearSidebarActive();

    loadDashboard();

}


window.goHome =
function() {

    showHomePage();

};



/* =====================================================
   OPEN MODULE
===================================================== */

window.openModule =
function(moduleName) {


    const module =
        modules[
            moduleName
        ];


    if (!module) {

        console.error(
            "Module not found:",
            moduleName
        );

        return;

    }



    setSidebarActive(
        moduleName
    );



    home.style.display =
        "none";

    page.style.display =
        "block";



    /* =================================================
       SPECIAL DECISION PAGE
    ================================================= */

    if (
        moduleName ===
        "decision"
    ) {

        openDecisionPage();

        return;

    }



    /* =================================================
       NORMAL MODULE
    ================================================= */

    page.innerHTML = `

        <button
            class="back"
            onclick="goHome()"
        >
            ← முகப்பு
        </button>


        <div
            class="module-header"
        >

            <h2>
                ${escapeHTML(
                    module.title
                )}
            </h2>

            <p>
                ${escapeHTML(
                    module.subtitle
                )}
            </p>

        </div>


        <div
            class="menu-grid"
        >

            ${
                module.menus
                    .map(
                        menu => `

                            <button
                                class="menu"
                                onclick="
                                    openForm(
                                        '${moduleName}',
                                        '${escapeAttribute(menu)}'
                                    )
                                "
                            >

                                <b>
                                    ${escapeHTML(
                                        menu
                                    )}

===================================================== */

window.saveEntry =
async function(

    moduleName,

    menuName

) {


    const dateElement =
        document.getElementById(
            "date"
        );


    const personElement =
        document.getElementById(
            "person"
        );


    const categoryElement =
        document.getElementById(
            "category"
        );


    const amountElement =
        document.getElementById(
            "amount"
        );


    const noteElement =
        document.getElementById(
            "note"
        );



    if (
        !dateElement ||
        !amountElement
    ) {

        return;

    }



    const date =
        dateElement.value;


    const person =
        personElement
            .value
            .trim();


    const category =
        categoryElement.value;


    const amount =
        Number(
            amountElement.value
        );


    const note =
        noteElement
            .value
            .trim();



    if (!date) {

        alert(
            "தேதியை தேர்வு செய்யவும்"
        );

        return;

    }


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "சரியான தொகையை உள்ளிடவும்"
        );

        return;

    }



    try {


        await addDoc(

            collection(
                db,
                "transactions"
            ),

            {

                module:
                    moduleName,

                type:
                    menuName,

                date:
                    date,

                person:
                    person,

                category:
                    category,

                amount:
                    amount,

                note:
                    note,

                createdAt:
                    serverTimestamp()

            }

        );



        alert(
            "✅ கணக்கு வெற்றிகரமாக சேமிக்கப்பட்டது"
        );


        amountElement.value =
            "";

        personElement.value =
            "";

        noteElement.value =
            "";


        loadEntries(
            moduleName,
            menuName
        );


        loadDashboard();


    }
    catch (error) {

        console.error(
            "Firebase Save Error:",
            error
        );

        alert(
            "Firebase Error: " +
            error.message
        );

    }

};



/* =====================================================
   LOAD ENTRIES
===================================================== */

async function loadEntries(

    moduleName,

    menuName

) {


    const records =
        document.getElementById(
            "records"
        );


    if (!records) {

        return;

    }



    try {


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "transactions"
                )

            );


        let html = "";



        snapshot.forEach(
            transactionDoc => {


                const data =
                    transactionDoc.data();



                if (

                    data.module ===
                        moduleName &&

                    data.type ===
                        menuName

                ) {


                    html += `

                        <div
                            class="record"
                        >

                            <div
                                class="record-top"
                            >

                                <b
                                    class="record-amount"
                                >

                                    ₹${Number(
                                        data.amount ||
                                        0
                                    ).toLocaleString(
                                        "en-IN"
                                    )}

                                </b>

                                <small>

                                    ${escapeHTML(
                                        data.date ||
                                        ""
                                    )}

                                </small>

                            </div>


                            <div
                                class="record-person"
                            >

                                ${escapeHTML(
                                    data.person ||
                                    "-"
                                )}

                            </div>


                            <div
                                class="record-category"
                            >

                                Category:
                                ${escapeHTML(
                                    data.category ||
                                    "-"
                                )}

                            </div>


                            ${
                                data.note
                                ? `
                                    <div
                                        class="record-note"
                                    >
                                        ${escapeHTML(
                                            data.note
                                        )}
                                    </div>
                                `
                                : ""
                            }

                        </div>

                    `;

                }

            }
        );



        records.innerHTML =
            html ||

            `

                <div
                    class="loading"
                >
                    இன்னும் பதிவுகள் இல்லை
                </div>

            `;


    }
    catch (error) {

        console.error(
            "Load Entries Error:",
            error
        );


        records.innerHTML = `

            <div class="loading">
                ❌ Firebase data load error
            </div>

        `;

    }

}

===================================================== */

let decisionData = [];



/* =====================================================
   LOAD DECISIONS
===================================================== */

async function loadDecisions() {


    const records =
        document.getElementById(
            "decisionRecords"
        );


    if (!records) {

        return;

    }



    try {


        records.innerHTML = `

            <div class="loading">
                தீர்மானங்கள் ஏற்றப்படுகிறது...
            </div>

        `;



        const snapshot =
            await getDocs(

                collection(
                    db,
                    "decisions"
                )

            );



        decisionData = [];



        snapshot.forEach(
            decisionDoc => {

                decisionData.push({

                    id:
                        decisionDoc.id,

                    ...decisionDoc.data()

                });

            }
        );



        decisionData.sort(
            (a, b) => {

                const aTime =
                    a.createdAt?.seconds ||
                    0;

                const bTime =
                    b.createdAt?.seconds ||
                    0;

                return bTime - aTime;

            }
        );



        displayDecisions(
            decisionData
        );


    }
    catch (error) {

        console.error(
            "Decision Load Error:",
            error
        );


        records.innerHTML = `

            <div class="empty">
                ❌ தீர்மானங்கள் load செய்ய முடியவில்லை
                <br><br>
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;

    }

}

window.saveDecision =
async function() {


    const date =
        document.getElementById(
            "decisionDate"
        ).value;


    const decisionNo =
        document.getElementById(
            "decisionNo"
        ).value.trim();


    const description =
        document.getElementById(
            "decisionDescription"
        ).value.trim();


    const status =
        document.getElementById(
            "decisionStatus"
        ).value;



    /* =================================================
       VALIDATION
    ================================================= */

    if (!date) {

        showDecisionMessage(
            "❌ தேதியை தேர்வு செய்யவும்",
            "error"
        );

        return;

    }


    if (!decisionNo) {

        showDecisionMessage(
            "❌ தீர்மான எண்ணை உள்ளிடவும்",
            "error"
        );

        return;

    }


    if (!description) {

        showDecisionMessage(
            "❌ தீர்மான விவரத்தை உள்ளிடவும்",
            "error"
        );

        return;

    }



    try {


        const editingId =
            window.editingDecisionId;



        /* =================================================
           UPDATE
        ================================================= */

        if (editingId) {


            await updateDoc(

                doc(
                    db,
                    "decisions",
                    editingId
                ),

                {

                    date:
                        date,

                    decisionNo:
                        decisionNo,

                    description:
                        description,

                    status:
                        status

                }

            );



            showDecisionMessage(
                "✅ தீர்மானம் மாற்றப்பட்டது",
                "success"
            );

        }



        /* =================================================
           ADD
        ================================================= */

        else {


            await addDoc(

                collection(
                    db,
                    "decisions"
                ),

                {

                    date:
                        date,

                    decisionNo:
                        decisionNo,

                    description:
                        description,

                    status:
                        status,

                    createdAt:
                        serverTimestamp()

                }

            );



            showDecisionMessage(
                "✅ தீர்மானம் வெற்றிகரமாக சேமிக்கப்பட்டது",
                "success"
            );

        }



        /* =================================================
           RESET
        ================================================= */

        resetDecisionForm();


        await loadDecisions();


    }
    catch (error) {

        console.error(
            "Decision Save Error:",
            error
        );


        showDecisionMessage(
            "❌ Firebase Error: " +
            error.message,
            "error"
        );

    }

};

async function(id) {

        decisionData.find(
            item =>
                item.id === id
        );


    if (!decision) {

        return;

    }



    const confirmed =
        confirm(

            `தீர்மான எண் ${
                decision.decisionNo || ""
            }-ஐ delete செய்ய வேண்டுமா?`

        );


    if (!confirmed) {

        return;

    }



    try {


        await deleteDoc(

            doc(
                db,
                "decisions",
                id
            )

        );



        alert(
            "✅ தீர்மானம் Delete செய்யப்பட்டது"
        );



        await loadDecisions();


    }
    catch (error) {

        console.error(
            "Decision Delete Error:",
            error
        );


        alert(
            "❌ Delete Error: " +
            error.message
        );

    }

};

/* =====================================================
   RESET DECISION FORM
===================================================== */

function resetDecisionForm() {


    const date =
        document.getElementById(
            "decisionDate"
        );


    const no =
        document.getElementById(
            "decisionNo"
        );


    const description =
        document.getElementById(
            "decisionDescription"
        );


    const status =
        document.getElementById(
            "decisionStatus"
        );


    const saveButton =
        document.getElementById(
            "decisionSaveButton"
        );


    const cancelButton =
        document.getElementById(
            "decisionCancelButton"
        );



    if (!date) {

        return;

    }



    date.value =
        new Date()
            .toISOString()
            .split("T")[0];


    no.value =
        "";


    description.value =
        "";


    status.value =
        "நிறைவேற்றப்பட்டது";



    window.editingDecisionId =
        null;



    saveButton.textContent =
        "💾 தீர்மானம் சேமிக்கவும்";


    cancelButton.style.display =
        "none";

}



/* =====================================================
   DECISION MESSAGE
===================================================== */

function showDecisionMessage(
    text,
    type
) {


    const message =
        document.getElementById(
            "decisionMessage"
        );


    if (!message) {

        return;

    }



    message.textContent =
        text;


    message.className =
        "message " +
        type;



    setTimeout(
        () => {

            message.textContent =
                "";

            message.className =
                "message";

        },
        3000
    );

}



/* =====================================================
   SEARCH DECISIONS
===================================================== */

function filterDecisions() {


    const search =
        document.getElementById(
            "decisionSearch"
        ).value
        .trim()
        .toLowerCase();



    if (!search) {

        displayDecisions(
            decisionData
        );

        return;

    }



    const filtered =
        decisionData.filter(
            decision => {


                const no =
                    String(
                        decision.decisionNo ||
                        ""
                    ).toLowerCase();


                const date =
                    String(
                        decision.date ||
                        ""
                    ).toLowerCase();


                const description =
                    String(
                        decision.description ||
                        ""
                    ).toLowerCase();


                const status =
                    String(
                        decision.status ||
                        ""
                    ).toLowerCase();



                return (

                    no.includes(
                        search
                    ) ||

                    date.includes(
                        search
                    ) ||

                    description.includes(
                        search
                    ) ||

                    status.includes(
                        search
                    )

                );

            }
        );



    displayDecisions(
        filtered
    );

}



/* =====================================================
   DASHBOARD
===================================================== */

async function loadDashboard() {


    try {


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "transactions"
                )

            );



        let income = 0;

        let expense = 0;

        let split = 0;



        snapshot.forEach(
            transactionDoc => {


                const data =
                    transactionDoc.data();


                const amount =
                    Number(
                        data.amount ||
                        0
                    );


                const type =
                    String(
                        data.type ||
                        ""
                    ).toLowerCase();



                /* EXPENSE */

                if (

                    type.includes(
                        "expense"
                    ) ||

                    type.includes(
                        "செலவு"
                    )

                ) {

                    expense +=
                        amount;

                }



                /* SPLIT */

                else if (

                    type.includes(
                        "split amount to"
                    )

                ) {

                    split +=
                        amount;

                }



                /* COLLECTION */

                else if (

                    type.includes(
                        "collection"
                    )

                ) {

                    income +=
                        amount;

                }



                /* INCOME */

                else {

                    income +=
                        amount;

                }

            }
        );



        totalIncome =
            income;


        totalExpense =
            expense;


        totalSplit =
            split;



        const incomeElement =
            document.getElementById(
                "totalIncome"
            );


        if (incomeElement) {

            incomeElement.textContent =
                "₹" +
                income.toLocaleString(
                    "en-IN"
                );

        }



        const expenseElement =
            document.getElementById(
                "totalExpense"
            );


        if (expenseElement) {

            expenseElement.textContent =
                "₹" +
                expense.toLocaleString(
                    "en-IN"
                );

        }



        const balanceElement =
            document.getElementById(
                "balance"
            );


        if (balanceElement) {

            const balance =
                income -
                expense -
                split;


            balanceElement.textContent =
                "₹" +
                balance.toLocaleString(
                    "en-IN"
                );

        }



        const splitElement =
            document.getElementById(
                "totalSplit"
            );


        if (splitElement) {

            splitElement.textContent =
                "₹" +
                split.toLocaleString(
                    "en-IN"
                );

        }


    }
    catch (error) {

        console.error(
            "Dashboard Error:",
            error
        );

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return String(value)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        );

}
