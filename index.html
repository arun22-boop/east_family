<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PKV East - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                "Noto Sans Tamil",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #581c87,
                    #7e22ce,
                    #9333ea
                );
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #f3e8ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        h1 {
            margin: 0;

            color: #581c87;

            font-size: 23px;

            line-height: 1.4;
        }

        .subtitle {
            margin: 7px 0 25px;

            color: #777;

            font-size: 13px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            font-size: 14px;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #7e22ce;

            box-shadow:
                0 0 0 3px
                #7e22ce22;
        }

        .login-button {
            width: 100%;

            border: 0;

            padding: 14px;

            margin-top: 8px;

            border-radius: 10px;

            background: #6b21a8;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #581c87;
        }

        .login-button:active {
            transform: scale(0.99);
        }

        .login-button:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        .error {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 9px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 13px;

            text-align: left;

            line-height: 1.5;
        }

        .success {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 9px;

            background: #dcfce7;

            color: #166534;

            font-size: 13px;

            text-align: left;

            line-height: 1.5;
        }

        .login-info {
            margin-top: 20px;

            padding: 12px;

            background: #faf5ff;

            border-radius: 10px;

            color: #6b21a8;

            font-size: 12px;

            line-height: 1.7;
        }

        .footer {
            margin-top: 20px;

            color: #999;

            font-size: 11px;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-box {
                padding: 25px 20px;
            }

            h1 {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-box">


            <!-- LOGO -->

            <div class="logo">
                🛕
            </div>


            <!-- TITLE -->

            <h1>
                P.K. வேலம்பாளையம் கிழக்கு
            </h1>


            <div class="subtitle">
                வரவு • செலவு • கையிருப்பு கணக்கு
            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    id="loginButton"
                    class="login-button"
                    type="submit"
                >
                    🔐 Login
                </button>


                <!-- ERROR -->

                <div
                    id="errorMessage"
                    class="error"
                ></div>


                <!-- SUCCESS -->

                <div
                    id="successMessage"
                    class="success"
                ></div>


            </form>


            <!-- DEMO LOGIN -->

            <div class="login-info">

                <b>Demo Login</b>

                <br>

                Username:
                <b>admin</b>

                <br>

                Password:
                <b>admin123</b>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                PKV East Accounting System

            </div>


        </div>

    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ===================================================== -->

    <script>

        "use strict";


        console.log(
            "PKV East Login Page Loaded"
        );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const successMessage =
            document.getElementById(
                "successMessage"
            );


        /* =====================================================
           STORAGE KEY
        ===================================================== */

        const LOGIN_KEY =
            "pkvEastLoggedIn";


        /* =====================================================
           SHOW ERROR
        ===================================================== */

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

            successMessage.style.display =
                "none";

        }


        /* =====================================================
           SHOW SUCCESS
        ===================================================== */

        function showSuccess(message) {

            successMessage.textContent =
                message;

            successMessage.style.display =
                "block";

            errorMessage.style.display =
                "none";

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                console.log(
                    "Login button clicked"
                );


                const username =
                    usernameInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value
                        .trim();


                console.log(
                    "Username:",
                    username
                );


                /* CLEAR MESSAGES */

                errorMessage.style.display =
                    "none";

                successMessage.style.display =
                    "none";


                /* =================================================
                   VALIDATION
                ================================================= */

                if (!username) {

                    showError(
                        "❌ Username உள்ளிடவும்."
                    );

                    usernameInput.focus();

                    return;

                }


                if (!password) {

                    showError(
                        "❌ Password உள்ளிடவும்."
                    );

                    passwordInput.focus();

                    return;

                }


                /* =================================================
                   LOGIN CHECK
                ================================================= */

                if (
                    username === "admin" &&
                    password === "admin123"
                ) {


                    console.log(
                        "LOGIN SUCCESS"
                    );


                    /* =============================================
                       SAVE LOGIN
                    ============================================= */

                    sessionStorage.setItem(
                        LOGIN_KEY,
                        "true"
                    );

                    localStorage.setItem(
                        LOGIN_KEY,
                        "true"
                    );


                    /* =============================================
                       SUCCESS MESSAGE
                    ============================================= */

                    showSuccess(
                        "✅ Login successful. Dashboard திறக்கப்படுகிறது..."
                    );


                    /* =============================================
                       DISABLE BUTTON
                    ============================================= */

                    loginButton.disabled =
                        true;

                    loginButton.textContent =
                        "⏳ Opening Dashboard...";


                    /* =============================================
                       OPEN DASHBOARD
                       
                       IMPORTANT:
                       dashboard.html is in the SAME ROOT
                       folder as index.html.
                    ============================================= */

                    setTimeout(
                        function() {

                            console.log(
                                "Opening dashboard.html"
                            );

                            window.location.assign(
                                "./dashboard.html"
                            );

                        },
                        700
                    );

                }

                else {


                    console.log(
                        "LOGIN FAILED"
                    );


                    showError(
                        "❌ Username அல்லது Password தவறாக உள்ளது."
                    );


                    passwordInput.value = "";

                    passwordInput.focus();

                }

            }
        );


        /* =====================================================
           PASSWORD ENTER KEY
        ===================================================== */

        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    loginForm.requestSubmit();

                }

            }
        );


        /* =====================================================
           CHECK EXISTING LOGIN
           
           IMPORTANT:
           If already logged in, automatically open
           dashboard.html.
        ===================================================== */

        const existingSession =
            sessionStorage.getItem(
                LOGIN_KEY
            );


        const existingLocal =
            localStorage.getItem(
                LOGIN_KEY
            );


        console.log(
            "Session Login:",
            existingSession
        );

        console.log(
            "Local Login:",
            existingLocal
        );


        /* =====================================================
           AUTO OPEN DASHBOARD
        ===================================================== */

        if (
            existingSession === "true" ||
            existingLocal === "true"
        ) {

            console.log(
                "Existing login found."
            );


            /*
             * Small delay prevents browser navigation
             * issues while Vite is loading.
             */

            setTimeout(
                function() {

                    window.location.assign(
                        "./dashboard.html"
                    );

                },
                100
            );

        }


    </script>


</body>

</html>
